<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Threads Viewer</title>
<style>
:root{--bg:#f6f5f2;--ink:#1b1b1b;--mute:#6b6b6b;--line:#d9d6cf;--accent:#2f5d50}
@media(prefers-color-scheme:dark){:root{--bg:#161615;--ink:#ecebe7;--mute:#9a9892;--line:#33322f;--accent:#7fc4ae}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:17px/1.5 Georgia,serif;padding:24px}
main{width:100%;max-width:560px}
h1{font-size:2rem;margin:0 0 8px;font-weight:700}
p{color:var(--mute);margin:0 0 24px}
form{display:flex;gap:8px}
input{flex:1;min-width:0;padding:14px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink);font:inherit}
button{padding:14px 20px;border:0;border-radius:8px;background:var(--accent);color:var(--bg);font:inherit;font-weight:700;cursor:pointer}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.err{color:#c0392b;margin-top:12px}
small{display:block;margin-top:28px;color:var(--mute)}
</style>
</head>
<body>
<main>
<h1>Read Threads posts without Threads</h1>
<p>Paste a post link. No app, no account.</p>
<form action="/open" method="get">
<input name="url" placeholder="https://www.threads.net/@user/post/..." aria-label="Threads post link" required autofocus>
<button>Open</button>
</form>
{% if error %}<div class="err">{{ error }}</div>{% endif %}
<small>Shortcut: in any Threads link, replace <b>threads.net</b> with this site's domain.</small>
</main>
</body>
</html>
